# JARLIS: canonical English strings.
# All other language files use this as the fallback for missing keys.
# Keys use dotted-path notation (notify.stuck.subject) for readability.

# Email sign-off keywords used by the body-signature detector.
# Lower-cased, no trailing punctuation. The detector recognizes these as
# the start of a signature block; the next non-empty line is taken as the
# writer's name. Adding a new language? Add the same key to its TOML and
# JARLIS picks it up automatically (no code change).
[signature]
closings = [
  "best",
  "best regards",
  "kind regards",
  "sincerely",
  "cheers",
  "thanks",
  "thank you",
  "regards",
  "warmly",
  "cordially",
]

# ---------- Notifications (subject + body of alert/test emails) ----------

[drafts.notification]
subject_prefix              = "[{org}] Draft for"
greeting                    = "Hi {name},"
intro                       = "JARLIS drafted a reply for an email received at {from_address}. Review the proposal below; when you're ready, hit Reply (the Reply-To header is set to the original sender) or send it from wherever you normally reply."
label_original              = "Original email"
label_draft                 = "Proposed draft"
label_reason                = "Reason"
label_attachments           = "Attachments"
label_summary               = "Summary"
label_translation_original  = "Original translated to {target_lang}"
label_translation_draft     = "Proposed draft translated to {target_lang}"
local_path                  = "Local copy: {path}"
label_meeting               = "Online meeting detected:"
meeting_when_detected       = "Proposed date/time: {when}"
meeting_when_unknown        = "Date/time not detected — fill in manually in Google Calendar"
calendar_link               = "Add to Google Calendar: {url}"
signoff                     = "JARLIS"

[attention.notification]
subject_prefix              = "[{org}] Needs attention"
intro                       = "JARLIS spotted an email that needs your attention on {from_address}. No draft was prepared; here is the gist. Click Reply (the Reply-To header points at the original sender) if you want to respond."

[notify.test]
subject = "[{org}] JARLIS test"
body = """Hi {name},

This is a JARLIS test message: your notification email is wired up correctly.

, JARLIS"""

[notify.stuck]
subject = "[{org}] ALERT: pipeline stuck ({count} unprocessed)"
body = """Hi {name},

The JARLIS pipeline appears to be stuck: {count} email(s) sat unprocessed across {threshold} consecutive runs.

Recent backlog history: {history}

Pipeline log:
  {log_path}

, JARLIS"""

