# JARLIS: chaînes en français.

[signature]
closings = [
  "cordialement",
  "bien cordialement",
  "très cordialement",
  "tres cordialement",
  "bien à vous",
  "bien a vous",
  "bien à toi",
  "bien a toi",
  "amicalement",
  "salutations",
  "meilleures salutations",
  "à bientôt",
  "a bientot",
  "respectueusement",
  "sincèrement",
  "sincerement",
]

[drafts.notification]
subject_prefix              = "[{org}] Brouillon pour"
greeting                    = "Bonjour {name},"
intro                       = "JARLIS a préparé un brouillon de réponse pour un email reçu sur {from_address}. Relis la proposition ci-dessous ; quand tu es prêt, clique sur Répondre (l'en-tête Reply-To pointe sur l'expéditeur d'origine) ou envoie-la depuis où tu réponds d'habitude."
label_original              = "Email d'origine"
label_draft                 = "Brouillon proposé"
label_reason                = "Motif"
label_attachments           = "Pièces jointes"
label_attachment_translation = "traduction de la pièce jointe en {target_lang}"
label_summary               = "Résumé"
label_translation_original  = "Email d'origine traduit en {target_lang}"
label_translation_draft     = "Brouillon proposé traduit en {target_lang}"
local_path                  = "Copie locale : {path}"
label_meeting               = "Réunion en ligne détectée :"
meeting_when_detected       = "Date/heure proposée : {when}"
meeting_when_unknown        = "Date/heure non détectée — à compléter manuellement dans Google Agenda"
calendar_link               = "Ajouter à Google Agenda : {url}"
signoff                     = "JARLIS"

[attention.notification]
subject_prefix              = "[{org}] À traiter"
intro                       = "JARLIS a repéré un email qui demande ton attention sur {from_address}. Pas de brouillon préparé ; voici l'essentiel. Clique sur Répondre (l'en-tête Reply-To pointe sur l'expéditeur d'origine) si tu veux y répondre."

[notify.test]
subject = "[{org}] Test JARLIS"
body = """Bonjour {name},

Ceci est un message de test JARLIS: ta boîte de notification est bien configurée.

, JARLIS"""

[notify.stuck]
subject = "[{org}] ALERTE: Pipeline bloqué ({count} emails en attente)"
body = """Bonjour {name},

Le pipeline JARLIS semble bloqué : {count} email(s) non traité(s) depuis {threshold} exécutions consécutives.

Historique récent : {history}

Vérifie le log du pipeline :
  {log_path}

, JARLIS"""

[notify.overlap_killed]
subject = "[{org}] {label} : exécution simultanée interrompue"
body = """Bonjour {name},

Une nouvelle exécution de {label} a démarré alors que la précédente tournait encore. JARLIS a donc arrêté l'ancienne et continué avec la nouvelle.

Exécution arrêtée : pid {pid}, démarrée {started_at}

Un chevauchement isolé vient en général d'un appel IA lent. Si ça se répète, c'est que l'exécution dure plus longtemps que son intervalle.

Log :
  {log_path}

, JARLIS"""

[notify.overlap_aborted]
subject = "[{org}] {label} : chevauchements répétés, exécution abandonnée"
body = """Bonjour {name},

{label} s'est de nouveau chevauché juste après que JARLIS ait déjà arrêté une exécution pour la même raison. Plutôt que de tuer un processus à chaque tour, celle-ci s'est arrêtée d'elle-même et a laissé la précédente tranquille.

Toujours en cours : pid {pid}, démarrée {started_at}

Quelque chose bloque le job. Un coup d'oeil au log s'impose, et à un éventuel CLI IA qui ne rend pas la main.

Log :
  {log_path}

, JARLIS"""

[notify.timeout]
subject = "[{org}] {label} : exécution tuée après {minutes} min"
body = """Bonjour {name},

L'exécution de {label} a dépassé sa limite de temps ({minutes} min) et a été tuée pour ne pas bloquer la suivante.

Ce qu'elle traitait sera repris à la prochaine exécution.

Log :
  {log_path}

, JARLIS"""

