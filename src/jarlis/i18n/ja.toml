# JARLIS: 日本語の文字列。
# 未訳のキーは英語にフォールバックします。

# Japanese email convention is "<name>より … <name>" rather than a
# Western-style closing keyword + name. The Japanese-specific path is
# implemented via regex in bootstrap.py; this section stays empty.
# Other Western keywords (e.g. "regards") are picked up from en.toml.
[signature]
closings = []

[drafts.notification]
subject_prefix              = "[{org}] 下書き"
greeting                    = "{name} さん、"
intro                       = "{from_address} に届いたメールについて、JARLIS が返信案を作成しました。下記の提案を確認し、準備ができたら「返信」(Reply-To は元の送信者を指しています)もしくは普段使っているメールクライアントから送信してください。"
label_original              = "元のメール"
label_draft                 = "提案下書き"
label_reason                = "理由"
label_attachments           = "添付ファイル"
label_attachment_translation = "添付ファイルの{target_lang}訳"
label_summary               = "要約"
label_translation_original  = "元のメールの {target_lang} 訳"
label_translation_draft     = "提案下書きの {target_lang} 訳"
local_path                  = "ローカルコピー: {path}"
label_meeting               = "オンライン会議リンクを検出しました："
meeting_when_detected       = "提案された日時：{when}"
meeting_when_unknown        = "日時を検出できませんでした。Google カレンダーで手動で設定してください"
calendar_link               = "Google カレンダーに追加：{url}"
signoff                     = "JARLIS"

[attention.notification]
subject_prefix              = "[{org}] 要対応"
intro                       = "{from_address} に届いたメールのうち、確認が必要なものを JARLIS が見つけました。下書きは作成していません。要点は以下のとおりです。返信される場合は「返信」をクリックしてください（Reply-To は元の差出人に設定されています）。"

[notify.test]
subject = "[{org}] JARLIS テスト"
body = """{name} さん、

これは JARLIS のテストメッセージです: 通知メールは正しく設定されています。

, JARLIS"""

[notify.stuck]
subject = "[{org}] アラート: パイプライン停止中 ({count} 件未処理)"
body = """{name} さん、

JARLIS パイプラインが停止しているようです：{threshold} 回連続の実行で {count} 件のメールが未処理のままです。

直近のバックログ履歴：{history}

パイプラインログ：
  {log_path}

, JARLIS"""

[notify.overlap_killed]
subject = "[{org}] {label}: 重複実行を停止しました"
body = """{name} さん、

前回の {label} の実行が終わらないうちに新しい実行が始まったため、JARLIS は古い方を停止し、新しい方を続行しました。

停止した実行：pid {pid}、開始 {started_at}

一度だけの重複はたいてい AI 呼び出しの遅延が原因です。繰り返す場合は、実行時間が実行間隔を超えています。

ログ：
  {log_path}

, JARLIS"""

[notify.overlap_aborted]
subject = "[{org}] {label}: 重複が続くため今回の実行を中止しました"
body = """{name} さん、

同じ理由で実行を停止した直後に、{label} がふたたび重複しました。毎回プロセスを停止するのを避けるため、今回の実行は自ら中止し、前の実行はそのままにしています。

実行中：pid {pid}、開始 {started_at}

ジョブが終了できない状態です。ログと、AI CLI が応答しているかの確認をおすすめします。

ログ：
  {log_path}

, JARLIS"""

[notify.timeout]
subject = "[{org}] {label}: {minutes} 分で強制終了しました"
body = """{name} さん、

{label} の実行が制限時間（{minutes} 分）を超えたため、次の実行を妨げないように強制終了しました。

処理中だった内容は次回の実行で再開されます。

ログ：
  {log_path}

, JARLIS"""

